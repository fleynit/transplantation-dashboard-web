name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 仅使用 Pages 自带的权限，无需任何仓库机密（Secrets）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 本仓库为纯静态站点（index.html + assets/），无需构建步骤。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
